name: verify

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "claude/**", "release/**"]
  workflow_dispatch: {}

# All jobs run with sandbox stubs flipped on — no real DSNs or upstream creds
# needed. The verify scripts assert the *code-only* exit criteria for each phase.
env:
  LLM_STUB: "1"
  STRIPE_STUB: "1"
  RATELIMIT_STUB: "1"
  OBSERVABILITY_STUB: "1"
  STUB_CRAWLER: "1"
  VALIDATE_STREAM_STUB: "1"
  GITHUB_STUB: "1"
  POLAR_STUB: "1"

jobs:
  static-checks:
    name: typecheck + lint + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Unit tests
        run: pnpm test

  # Matrix over every phase so a regression in any one is visible separately
  # in the PR checks UI. Each step exits non-zero on regression.
  phase-verify:
    name: verify:phase${{ matrix.phase }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        phase: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: pnpm verify:phase${{ matrix.phase }}
        run: pnpm verify:phase${{ matrix.phase }}

  build:
    name: pnpm build
    runs-on: ubuntu-latest
    needs: [static-checks, phase-verify]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
        env:
          # Build-time needs format-correct dummy env. Runtime gets the real
          # values from Vercel's env config.
          NEXT_PUBLIC_SUPABASE_URL: https://stub.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: stub
          SUPABASE_SERVICE_ROLE_KEY: stub
          ANTHROPIC_API_KEY: stub
          GROQ_API_KEY: stub
          PERPLEXITY_API_KEY: stub
          VOYAGE_API_KEY: stub
          COHERE_API_KEY: stub
          OPENROUTER_API_KEY: stub
          BRAVE_SEARCH_API_KEY: stub
          STRIPE_SECRET_KEY: sk_test_stub
          STRIPE_WEBHOOK_SECRET: whsec_stub
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_stub
          POLAR_ACCESS_TOKEN: stub
          POLAR_WEBHOOK_SECRET: stub
          UPSTASH_REDIS_REST_URL: https://stub.upstash.io
          UPSTASH_REDIS_REST_TOKEN: stub
          INNGEST_EVENT_KEY: stub
          INNGEST_SIGNING_KEY: signkey-stub-12345
          RESEND_API_KEY: stub
          FROM_EMAIL: stub@example.com
          LANGFUSE_PUBLIC_KEY: stub
          LANGFUSE_SECRET_KEY: stub
          LANGFUSE_HOST: https://cloud.langfuse.com
          AXIOM_TOKEN: stub
          AXIOM_DATASET: painpilot
          SENTRY_DSN: stub
          NEXT_PUBLIC_SENTRY_DSN: stub
          NEXT_PUBLIC_POSTHOG_KEY: stub
          NEXT_PUBLIC_POSTHOG_HOST: https://us.i.posthog.com
          NEXT_PUBLIC_APP_URL: https://painpilot.vercel.app
          REDDIT_USER_AGENT: painpilot-ci/0.1
          REDDIT_CLIENT_ID: stub
          REDDIT_CLIENT_SECRET: stub
          PRODUCT_HUNT_API_TOKEN: stub
          GITHUB_APP_ID: "1"
          GITHUB_APP_PRIVATE_KEY: stub
          GITHUB_APP_CLIENT_ID: stub
          GITHUB_APP_CLIENT_SECRET: stub
          GITHUB_APP_WEBHOOK_SECRET: stub
